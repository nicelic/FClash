name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.47.9'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test commit message hook
        run: bash tool/check_commit_msg_test.sh

      - name: Test comment density hook
        run: bash tool/check_comment_density_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Generate code and l10n
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run intl_utils:generate

      - name: Format code
        run: dart format lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  go:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./platform ./tun)" || {
            gofmt -l ./*.go ./platform ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet .
          GOOS=linux go vet ./platform

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: true

      - name: Validate the Android core library
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          CC="$(echo "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang)"
          test -x "$CC" || { echo "NDK clang not found at $CC" >&2; exit 1; }
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC
          go vet "-tags=$tags,cmfa" . ./tun ./platform

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache --android
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  prepare-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Prepare release
    needs: [ dart, plugins, go, android, rust ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch release.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pkg_version=$(echo "$TAG_NAME" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          sed -e "s|vVERSION|$TAG_NAME|g" -e "s|VERSION|$pkg_version|g" ./.github/release_template.md > release.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: './release.md'
          generate_release_notes: true
          prerelease: true

  build-android-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: android
      os: ubuntu-latest
      arch: arm64
      flutter_channel: stable
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-android-arm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: android
      os: ubuntu-latest
      arch: arm
      flutter_channel: stable
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-android-amd64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: android
      os: ubuntu-latest
      arch: amd64
      flutter_channel: stable
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-windows-amd64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: windows
      os: Windows-2022
      arch: amd64
      flutter_channel: stable
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-windows-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: windows
      os: windows-11-arm
      arch: arm64
      flutter_channel: master
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-linux-amd64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: linux
      os: ubuntu-22.04
      arch: amd64
      flutter_channel: stable
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-linux-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: linux
      os: ubuntu-24.04-arm
      arch: arm64
      flutter_channel: master
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-macos-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: macos
      os: macos-latest
      arch: arm64
      flutter_channel: stable
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  build-macos-amd64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_package.yaml
    with:
      platform: macos
      os: macos-15-intel
      arch: amd64
      flutter_channel: stable
      flutter_version: ${{ env.FLUTTER_VERSION }}
      go_version: ${{ env.GO_VERSION }}
      ndk_version: ${{ env.NDK_VERSION }}
      is_stable: ${{ env.IS_STABLE }}
    secrets: inherit

  publish-android-arm64:
    needs: [ prepare-release, dart, plugins, go, android, rust, build-android-arm64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-android-arm64
    secrets: inherit

  publish-android-arm:
    needs: [ prepare-release, dart, plugins, go, android, rust, build-android-arm ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-android-arm
    secrets: inherit

  publish-android-amd64:
    needs: [ prepare-release, dart, plugins, go, android, rust, build-android-amd64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-android-amd64
    secrets: inherit

  publish-windows-amd64:
    needs: [ prepare-release, dart, plugins, go, rust, windows-helper-test, build-windows-amd64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-windows-amd64
    secrets: inherit

  publish-windows-arm64:
    needs: [ prepare-release, dart, plugins, go, rust, windows-helper-test, build-windows-arm64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-windows-arm64
    secrets: inherit

  publish-linux-amd64:
    needs: [ prepare-release, dart, plugins, go, rust, build-linux-amd64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-linux-amd64
    secrets: inherit

  publish-linux-arm64:
    needs: [ prepare-release, dart, plugins, go, rust, build-linux-arm64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-linux-arm64
    secrets: inherit

  publish-macos-arm64:
    needs: [ prepare-release, dart, plugins, go, rust, build-macos-arm64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-macos-arm64
    secrets: inherit

  publish-macos-amd64:
    needs: [ prepare-release, dart, plugins, go, rust, build-macos-amd64 ]
    uses: ./.github/workflows/_publish.yaml
    permissions:
      contents: write
    with:
      artifact_name: pkg-macos-amd64
    secrets: inherit

  finalize-release:
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare-release.result == 'success' }}
    name: Finalize release
    needs:
      - prepare-release
      - publish-android-arm64
      - publish-android-arm
      - publish-android-amd64
      - publish-windows-amd64
      - publish-windows-arm64
      - publish-linux-amd64
      - publish-linux-arm64
      - publish-macos-arm64
      - publish-macos-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download checksum artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./checksums
          pattern: sha256-*
          merge-multiple: true

      - name: Publish SHA256SUMS and finalize release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALL_PUBLISHED: ${{ needs.publish-android-arm64.result == 'success' && needs.publish-android-arm.result == 'success' && needs.publish-android-amd64.result == 'success' && needs.publish-windows-amd64.result == 'success' && needs.publish-windows-arm64.result == 'success' && needs.publish-linux-amd64.result == 'success' && needs.publish-linux-arm64.result == 'success' && needs.publish-macos-arm64.result == 'success' && needs.publish-macos-amd64.result == 'success' }}
        run: |
          if compgen -G './checksums/SHA256SUMS.*' > /dev/null; then
            LC_ALL=C sort -k2 ./checksums/SHA256SUMS.* > SHA256SUMS
            gh release upload "${{ github.ref_name }}" ./SHA256SUMS \
              --repo "${{ github.repository }}" \
              --clobber
          fi
          if [ "${{ env.IS_STABLE }}" = "true" ] && [ "$ALL_PUBLISHED" = "true" ]; then
            gh release edit "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --prerelease=false
          fi
