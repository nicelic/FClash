name: publish-target

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.artifact_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ./dist

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(./dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No package files found in ./dist for ${{ inputs.artifact_name }}" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "${{ github.ref_name }}" "${files[@]}" \
              --repo "${{ github.repository }}" \
              --clobber; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
